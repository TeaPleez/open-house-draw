<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Open House Contest Entry</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; 
        }

        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #1e293b; 
            padding: 30px 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            position: relative;
            overflow-x: hidden;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        .container { 
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(10px);
            width: 100%; 
            max-width: 580px; 
            padding: 35px 30px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.1); 
            position: relative;
            z-index: 1;
        }

        .header { 
            text-align: center; 
            margin-bottom: 28px; 
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
            position: relative;
        }

        .celebration-icon {
            position: absolute;
            top: -5px;
            font-size: 32px;
            user-select: none;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
            animation: float 3s ease-in-out infinite alternate;
        }

        .celebration-left { left: 10px; }
        .celebration-right { right: 10px; animation-delay: 1.5s; }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-6px) rotate(5deg); }
        }

        .badge {
            display: inline-block;
            background: #eff6ff;
            color: #2563eb;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 6px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            margin-left: 8px;
            vertical-align: middle;
        }
        .status-online { background: #dcfce7; color: #15803d; }
        .status-offline { background: #fef3c7; color: #b45309; }

        .header h1 { 
            font-size: 26px; 
            font-weight: 800; 
            color: #0f172a; 
            letter-spacing: -0.5px;
            margin-bottom: 4px; 
        }

        .header p { 
            font-size: 14px; 
            color: #64748b; 
            font-weight: 500;
        }

        .form-group { margin-bottom: 22px; }

        label.field-label { 
            display: block; 
            font-size: 13px; 
            font-weight: 700; 
            margin-bottom: 8px; 
            color: #334155; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="tel"], input[type="email"], input[type="password"] { 
            width: 100%; 
            padding: 15px 18px; 
            font-size: 16px; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            background: #f8fafc; 
            color: #0f172a;
            outline: none; 
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .radio-group { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
        }

        .radio-card { 
            border: 2px solid #e2e8f0; 
            border-radius: 14px; 
            padding: 16px 12px; 
            text-align: center; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 600; 
            background: #f8fafc; 
            color: #475569;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 72px;
            user-select: none;
        }

        .radio-card input[type="radio"] { 
            display: none; 
        }

        .radio-card.selected { 
            border-color: #2563eb; 
            background: #eff6ff; 
            color: #1d4ed8; 
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }

        .badge-gold {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 10px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        #passcode-container { 
            display: none; 
            margin-top: 14px; 
            padding: 18px; 
            background: #fffbeb; 
            border: 1px solid #fef3c7; 
            border-radius: 14px; 
        }

        .checkbox-group { 
            display: flex; 
            align-items: flex-start; 
            gap: 12px; 
            margin: 26px 0; 
            background: #f8fafc; 
            padding: 16px; 
            border-radius: 14px; 
            border: 1px solid #e2e8f0; 
        }

        .checkbox-group input { 
            width: 22px; 
            height: 22px; 
            margin-top: 2px;
            accent-color: #2563eb; 
            cursor: pointer;
        }

        .checkbox-group label { 
            font-size: 13px; 
            font-weight: 400; 
            line-height: 1.45; 
            color: #475569; 
            text-transform: none;
            letter-spacing: 0;
            cursor: pointer;
        }

        button.submit-btn { 
            width: 100%; 
            padding: 18px; 
            font-size: 17px; 
            font-weight: 700; 
            color: #ffffff; 
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); 
            border: none; 
            border-radius: 14px; 
            cursor: pointer; 
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        button.submit-btn:disabled {
            background: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        button.submit-btn:active:not(:disabled) { transform: scale(0.99); }

        .footer-disclaimer { 
            text-align: center; 
            font-size: 11px; 
            color: #94a3b8; 
            margin-top: 22px; 
            line-height: 1.5; 
        }

        .success-screen { 
            display: none; 
            text-align: center; 
            padding: 30px 10px; 
        }

        .success-screen h2 {
            font-size: 28px;
            color: #0f172a;
            margin-bottom: 10px;
        }

        .success-screen p {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .reset-countdown {
            margin-top: 25px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="container">
    <div id="form-view">
        <div class="header">
            <div class="celebration-icon celebration-left">🎉</div>
            <div class="celebration-icon celebration-right">🎁</div>

            <span class="badge">Open House Draw</span>
            <span id="connection-status" class="status-badge status-online">Online</span>
            <h1>Dylan Jones</h1>
            <p>eXp Realty</p>
        </div>

        <form id="entryForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label class="field-label" for="fullName">Full Name *</label>
                <input type="text" id="fullName" required placeholder="First and Last Name">
            </div>

            <div class="form-group">
                <label class="field-label" for="phone">Phone Number *</label>
                <input type="tel" id="phone" required placeholder="(250) 000-0000">
            </div>

            <div class="form-group">
                <label class="field-label" for="email">Email Address *</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label class="field-label">Are you currently working with a REALTOR®? *</label>
                <div class="radio-group" id="realtorGroup">
                    <label class="radio-card" onclick="selectRadioCard(this, 'realtorGroup')">
                        <input type="radio" name="realtor" value="No" required>
                        <span>No</span>
                    </label>
                    <label class="radio-card" onclick="selectRadioCard(this, 'realtorGroup')">
                        <input type="radio" name="realtor" value="Yes">
                        <span>Yes</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label class="field-label">Contest Entry Type *</label>
                <div class="radio-group" id="entryTypeGroup">
                    <label class="radio-card selected" onclick="selectRadioCard(this, 'entryTypeGroup', 'Standard')">
                        <input type="radio" name="entryType" value="Standard" checked> 
                        <span>Standard Entry</span>
                        <span style="font-size: 12px; opacity: 0.8;">(1 Ticket)</span>
                    </label>
                    <label class="radio-card" onclick="selectRadioCard(this, 'entryTypeGroup', 'Winner')">
                        <input type="radio" name="entryType" value="Winner"> 
                        <span>Mini-Putt Winner</span>
                        <span class="badge-gold">3X TICKETS</span>
                    </label>
                </div>

                <div id="passcode-container">
                    <label class="field-label" for="passcode" style="color: #b45309;">Enter Host Passcode:</label>
                    <input type="password" id="passcode" placeholder="4-digit code" inputmode="numeric">
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="newsletter" checked>
                <label for="newsletter">Yes! Sign me up for the monthly newsletter with local highlights, market updates, home maintenance hacks and more! Can ubsubscribe at any time.</label>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Enter Draw</button>
        </form>

        <div class="footer-disclaimer">
            Contest winners notified directly via phone/email. Contest entry does not require newsletter subscription.
        </div>
    </div>

    <div id="success-view" class="success-screen">
        <div style="font-size: 54px; margin-bottom: 10px;">✨</div>
        <h2>You're Entered!</h2>
        <p id="success-message">Good luck in the draw! Thanks for stopping by today.</p>
        <div class="reset-countdown">This screen will reset for the next guest in <span id="timer">8</span> seconds.</div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyiQ0nLYDg1nzrmmH_xPtwgej23V8Ap_czRUWD_49Al-6P5njfpLE-SkG194NByPHtDhg/exec";
    const HOST_PASSCODE = "1234";

    // --- Confetti Engine ---
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animationFrameId = null;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerConfetti() {
        particles = [];
        const colors = ['#2563eb', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6', '#ec4899'];
        const count = 120;

        for (let i = 0; i < count; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 2,
                w: Math.random() * 10 + 5,
                h: Math.random() * 6 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                vx: (Math.random() - 0.5) * 18,
                vy: (Math.random() - 0.7) * 18,
                gravity: 0.3,
                friction: 0.96,
                rotation: Math.random() * 360,
                rotSpeed: (Math.random() - 0.5) * 12,
                opacity: 1
            });
        }

        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        animateConfetti();
    }

    function animateConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let activeParticles = 0;

        particles.forEach(p => {
            p.vx *= p.friction;
            p.vy *= p.friction;
            p.vy += p.gravity;
            p.x += p.vx;
            p.y += p.vy;
            p.rotation += p.rotSpeed;
            p.opacity -= 0.008;

            if (p.opacity > 0) {
                activeParticles++;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.globalAlpha = Math.max(0, p.opacity);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();
            }
        });

        if (activeParticles > 0) {
            animationFrameId = requestAnimationFrame(animateConfetti);
        } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    }
    // -----------------------

    function selectRadioCard(element, groupName, type) {
        const group = document.getElementById(groupName);
        group.querySelectorAll('.radio-card').forEach(card => card.classList.remove('selected'));
        element.classList.add('selected');
        
        const radio = element.querySelector('input[type="radio"]');
        radio.checked = true;

        if (groupName === 'entryTypeGroup') {
            const passcodeContainer = document.getElementById('passcode-container');
            if (type === 'Winner') {
                passcodeContainer.style.display = 'block';
                document.getElementById('passcode').required = true;
            } else {
                passcodeContainer.style.display = 'none';
                document.getElementById('passcode').required = false;
                document.getElementById('passcode').value = '';
            }
        }
    }

    async function handleSubmit(event) {
        event.preventDefault();

        const entryType = document.querySelector('input[name="entryType"]:checked').value;
        const passcode = document.getElementById('passcode').value;

        if (entryType === 'Winner' && passcode !== HOST_PASSCODE) {
            alert('Incorrect Host Passcode. Please check with the open house host.');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'Submitting Entry...';

        const formData = {
            fullName: document.getElementById('fullName').value,
            phone: document.getElementById('phone').value,
            email: document.getElementById('email').value,
            realtor: document.querySelector('input[name="realtor"]:checked') ? document.querySelector('input[name="realtor"]:checked').value : 'No',
            entryType: entryType,
            newsletter: document.getElementById('newsletter').checked ? 'Yes' : 'No',
            timestamp: new Date().toISOString()
        };

        try {
            if (navigator.onLine && SCRIPT_URL !== "https://script.google.com/macros/s/AKfycbyiQ0nLYDg1nzrmmH_xPtwgej23V8Ap_czRUWD_49Al-6P5njfpLE-SkG194NByPHtDhg/exec") {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
            } else {
                let offlineEntries = JSON.parse(localStorage.getItem('offlineEntries') || '[]');
                offlineEntries.push(formData);
                localStorage.setItem('offlineEntries', JSON.stringify(offlineEntries));
            }

            showSuccess(entryType);
        } catch (error) {
            console.error('Submission error:', error);
            let offlineEntries = JSON.parse(localStorage.getItem('offlineEntries') || '[]');
            offlineEntries.push(formData);
            localStorage.setItem('offlineEntries', JSON.stringify(offlineEntries));
            
            showSuccess(entryType);
        }
    }

    function showSuccess(entryType) {
        triggerConfetti(); // Triggers the canvas explosion

        document.getElementById('form-view').style.display = 'none';
        document.getElementById('success-view').style.display = 'block';
        
        if (entryType === 'Winner') {
            document.getElementById('success-message').innerText = "Congratulations on winning Mini-Putt! 3x tickets have been entered in the draw for you.";
        } else {
            document.getElementById('success-message').innerText = "Good luck in the draw! Thanks for stopping by today.";
        }

        let timeLeft = 8;
        const timerElement = document.getElementById('timer');
        
        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                resetForm();
            }
        }, 1000);
    }

    function resetForm() {
        document.getElementById('entryForm').reset();
        document.getElementById('form-view').style.display = 'block';
        document.getElementById('success-view').style.display = 'none';
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Enter Draw';

        const realtorCards = document.getElementById('realtorGroup').querySelectorAll('.radio-card');
        realtorCards.forEach(c => c.classList.remove('selected'));

        const entryTypeCards = document.getElementById('entryTypeGroup').querySelectorAll('.radio-card');
        entryTypeCards.forEach(c => c.classList.remove('selected'));
        entryTypeCards[0].classList.add('selected');
        
        document.getElementById('passcode-container').style.display = 'none';
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    function updateOnlineStatus() {
        const badge = document.getElementById('connection-status');
        if (navigator.onLine) {
            badge.className = 'status-badge status-online';
            badge.innerText = 'Online';
        } else {
            badge.className = 'status-badge status-offline';
            badge.innerText = 'Offline Mode';
        }
    }
</script>
</body>
</html>
