<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open House Contest Entry</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif}
body{background:linear-gradient(135deg,#0f172a,#1e293b);color:#1e293b;padding:30px 15px;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow-x:hidden}
#confetti-canvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999}
.container{background:rgba(255,255,255,.98);width:100%;max-width:580px;padding:35px 30px;border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,.25);position:relative;z-index:1}
.header{position:relative;text-align:center;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid #e2e8f0}
.gift{position:absolute;top:-5px;font-size:32px;line-height:1;user-select:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.1));animation:float 3s ease-in-out infinite alternate}
.gift-left{left:10px}.gift-right{right:10px;animation-delay:1.5s}
@keyframes float{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-6px) rotate(5deg)}}
.badge{display:inline-block;background:#eff6ff;color:#2563eb;font-size:12px;font-weight:700;letter-spacing:1.5px;padding:6px 14px;border-radius:20px;text-transform:uppercase;margin-bottom:10px}
.status-badge{display:inline-block;font-size:11px;font-weight:600;padding:4px 10px;border-radius:12px;margin-top:12px}
.status-online{background:#dcfce7;color:#15803d}.status-offline{background:#fef3c7;color:#b45309}
.header h1{font-size:26px;font-weight:800;color:#0f172a;letter-spacing:-.5px;margin-bottom:4px}
.header p{font-size:14px;color:#64748b;font-weight:500}
.form-group{margin-bottom:22px}
.field-label{display:block;font-size:15px;font-weight:700;margin-bottom:8px;color:#334155}
.prize{margin-top:16px;font-size:22px;font-weight:800;color:#0f172a;letter-spacing:-.3px}
.prize span{color:#d97706}
.opt{font-weight:500;text-transform:none;color:#94a3b8}
input[type=text],input[type=tel],input[type=email],input[type=password],select{width:100%;padding:15px 18px;font-size:16px;border:2px solid #e2e8f0;border-radius:12px;background:#f8fafc;color:#0f172a;outline:none;transition:all .2s}
input:focus,select:focus{border-color:#2563eb;background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.1)}
.radio-group{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.radio-group.three{grid-template-columns:repeat(3,1fr)}
.radio-card{position:relative;border:2px solid #e2e8f0;border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;font-size:14px;font-weight:600;background:#f8fafc;color:#475569;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:64px;user-select:none;transition:all .2s}
.radio-card input{position:absolute;opacity:0;width:1px;height:1px}
.radio-card:has(input:checked){border-color:#2563eb;background:#eff6ff;color:#1d4ed8;box-shadow:0 4px 12px rgba(37,99,235,.15)}
.radio-card:has(input:focus-visible){outline:3px solid #93c5fd}
.badge-gold{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:10px;letter-spacing:.5px}
#passcode-container{display:none;margin-top:14px;padding:18px;background:#fffbeb;border:1px solid #fef3c7;border-radius:14px}
.checkbox-group{display:flex;align-items:flex-start;gap:12px;margin:26px 0;background:#f8fafc;padding:16px;border-radius:14px;border:1px solid #e2e8f0}
.checkbox-group input{width:22px;height:22px;margin-top:2px;accent-color:#2563eb;cursor:pointer;flex:none}
.checkbox-group label{font-size:13px;line-height:1.45;color:#475569;cursor:pointer}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.submit-btn{width:100%;padding:18px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,#2563eb,#1d4ed8);border:none;border-radius:14px;cursor:pointer;box-shadow:0 8px 20px
